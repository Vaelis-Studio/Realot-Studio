<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realot Hub</title>

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#07070b">
    <!-- Root favicon.ico is the classic universal fallback browsers/
         crawlers check by convention even without a <link> tag, and is
         what Google Search's own guidance points at for homepage
         favicon discovery (see developers.google.com/search/docs/
         appearance/favicon-in-search). The explicit rel="icon" links
         below are what modern browsers actually use for the tab icon;
         both point at the same source image so hub and editor always
         match. -->
    <link rel="icon" href="favicon.svg?v=3" type="image/svg+xml" sizes="any">
    <link rel="icon" href="favicon.ico?v=3" sizes="16x16 32x32 48x48">
    <link rel="icon" href="icons/icon-32.png?v=3" type="image/png" sizes="32x32">
    <link rel="icon" href="icons/icon-192.png?v=3" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">

    <link href="css/fonts/fonts.css" rel="stylesheet">
    <script src="js/vendor/lucide.min.js"></script>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="antialiased">

    <div class="film-grain"></div>

    <!-- Title bar -->
    <div class="titlebar" id="titlebar-root"></div>

    <div class="app-shell">
        <!-- Left rail -->
        <aside class="rail" id="rail-root"></aside>

        <!-- Main -->
        <main class="main">
            <header class="topbar" id="topbar-root"></header>

            <div class="view-area" id="view-root">
                <!-- Views are mounted here by router.js -->
            </div>
        </main>
    </div>

    <!-- New Project modal mount -->
    <div id="modal-root"></div>

    <!-- Module scripts, dependency order matters (no bundler) -->
    <script src="js/data/RealotPersistence.js"></script>
    <script src="js/data/EngineVersion.js"></script>
    <script src="js/data/templates.js"></script>
    <script src="js/data/templates/platformer-starter.data.js"></script>
    <script src="js/data/templates/physics-sandbox.data.js"></script>
    <script src="js/data/templates/flappy-bird-starter.data.js"></script>
    <script src="js/data/templates/sky-jumper.data.js"></script>
    <script src="js/data/templates/topdown.data.js"></script>
    <script src="js/data/projects.js"></script>
    <script src="js/data/store.js"></script>
    <script src="js/data/pwa.js"></script>

    <script src="js/utils/dom.js"></script>
    <script src="js/utils/format.js"></script>
    <script src="js/utils/icons.js"></script>
    <script src="js/utils/nav.js"></script>

    <script src="js/components/Titlebar.js"></script>
    <script src="js/components/Rail.js"></script>
    <script src="js/components/Topbar.js"></script>
    <script src="js/components/ProjectCard.js"></script>
    <script src="js/components/ProjectList.js"></script>
    <script src="js/components/TemplateGrid.js"></script>
    <script src="js/components/NewProjectModal.js"></script>
    <script src="js/components/EmptyState.js"></script>
    <script src="js/components/LearnView.js"></script>
    <script src="js/components/InstallsView.js"></script>

    <script src="js/router.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
